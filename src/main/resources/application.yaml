spring:
  application:
    name: odyssey

server:
  port: 8080

logging:
  file:
    name: logs/odyssey.log
    path: logs
  logback:
    rollingpolicy:
      max-file-size: 10MB
      max-history: 30
      total-size-cap: 100MB
  level:
    root: INFO
    com.example.odyssey: DEBUG
    # CXF SOAP message logging
    org.apache.cxf: INFO
    org.apache.cxf.services: INFO
    org.apache.cxf.ext.logging: INFO
    org.apache.wss4j: INFO

efm:
  user-service:
    endpoint-url: ${efm.base-url}/EFM/EFMUserService.svc
  court-record-service:
    endpoint-url: ${efm.base-url}/EFM/CourtRecordMDEService.svc
  firm-service:
    endpoint-url: ${efm.base-url}/EFM/EFMFirmService.svc
  code-service:
    base-url: ${efm.base-url}/CodeService/codes
  security:
    keystore:
      path: classpath:certs/bitlink.pfx
      password: ${EFM_KEYSTORE_PASSWORD}
      type: PKCS12
    truststore:
      path: classpath:certs/tylerofsefmrootsha2.crt
